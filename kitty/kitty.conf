# BEGIN_KITTY_THEME
# Catppuccin Mocha
include current-theme.conf
# END_KITTY_THEME

# Fuentes más chéveres
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 14.0

# Configuración de ventana más moderna
window_margin_width 16
window_padding_width 20
hide_window_decorations yes
remember_window_size yes
initial_window_width 1400
initial_window_height 900

# Efectos de transparencia y blur épicos
background_opacity 0.88
background_blur 32
background_image none
background_image_layout scaled
background_image_linear no
dynamic_background_opacity yes

# Bordes y efectos visuales
window_border_width 0
window_margin_width 12
confirm_os_window_close 0
window_resize_step_cells 2
window_resize_step_lines 2
draw_minimal_borders yes
active_border_color #cba6f7
inactive_border_color #313244

# Configuración de tabs más chévere
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "  {index}: {title}  "
tab_bar_min_tabs 1
tab_bar_margin_width 8
tab_bar_margin_height 8 0
tab_bar_background #1e1e2e
active_tab_foreground #cdd6f4
active_tab_background #cba6f7
active_tab_font_style bold
inactive_tab_foreground #6c7086
inactive_tab_background #313244
inactive_tab_font_style normal

# Cursor más chévere
cursor_shape block
cursor_beam_thickness 2
cursor_underline_thickness 2
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback mejorado
scrollback_lines 50000
scrollback_pager_history_size 50000
scrollback_fill_enlarged_window yes

# URL handling más inteligente
url_color #89b4fa
url_style curly
open_url_with default
detect_urls yes
copy_on_select yes

# Audio y notificaciones
enable_audio_bell no
visual_bell_duration 0.1
window_alert_on_bell yes
bell_on_tab " 🔔 "

# Rendimiento optimizado
repaint_delay 10
input_delay 3
sync_to_monitor yes
