# Hyprlock Configuration
# Diseño profesional basado en Swaylock

# Configuración general
general {
    disable_loading_bar = false
    grace = 0
    hide_cursor = true
    no_fade_in = false
}

# Configuración del fondo con efecto blur
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 15
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Reloj principal
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(205, 214, 244, 1.0)
    font_size = 90
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %B %e"
    color = rgba(205, 214, 244, 0.8)
    font_size = 25
    font_family = Inter
    position = 0, 240
    halign = center
    valign = center
}

# Campo de entrada de contraseña
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(17, 17, 27, 1.0)
    inner_color = rgba(30, 30, 30, 1.0)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Ingresa tu contraseña...</i>
    hide_input = false
    rounding = -1
    check_color = rgba(203, 166, 247, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transitions = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, 0
    halign = center
    valign = center
}

